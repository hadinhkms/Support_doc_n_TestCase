name: Flaky test
description: Test cho kết quả không ổn định trên cùng một commit
labels: [flaky, test-debt]
body:
  - type: input
    id: test
    attributes:
      label: Test
      description: Đường dẫn spec + test title đầy đủ.
      placeholder: 'tests/auth/login.spec.ts - TC-005 - AC-004 session survives a page reload'
    validations: { required: true }

  - type: input
    id: rate
    attributes:
      label: Tỷ lệ fail
      placeholder: '3/10 lần chạy gần nhất'
    validations: { required: true }

  - type: dropdown
    id: cause
    attributes:
      label: Phân loại nguyên nhân
      description: Xem bảng trong docs/flaky-test-policy.md. Bắt buộc phân loại trước khi quarantine.
      options:
        - Lỗi thật của app, hành vi không tất định
        - Chờ sai (timing/assertion)
        - Dữ liệu đụng nhau khi chạy song song
        - Locator không ổn định
        - Hạ tầng / môi trường
        - Chưa xác định
    validations: { required: true }

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Trace của lần fail, link CI run.
    validations: { required: true }

  - type: input
    id: owner
    attributes:
      label: Owner và hạn xử lý
      description: Tối đa 3 ngày làm việc để sửa hoặc quarantine; quarantine tối đa 2 tuần.
      placeholder: '@qa-an - 2026-10-05'
    validations: { required: true }

  - type: checkboxes
    id: quarantine
    attributes:
      label: Trạng thái
      options:
        - label: Đã gắn tag `@wip` để loại khỏi gate của PR (vẫn chạy ở nightly)
        - label: Đã ghi rủi ro chưa được phủ vào mục `Uncovered risk` của file test case
