name: Bug report
description: Báo lỗi phát hiện khi test thủ công hoặc automation
labels: [bug, needs-triage]
body:
  - type: input
    id: summary
    attributes:
      label: Tóm tắt
      description: Một câu ngắn gọn, dễ hình dung hành vi sai.
      placeholder: 'Đăng nhập sai mật khẩu vẫn tạo session và vào được /dashboard'
    validations: { required: true }

  - type: textarea
    id: business_context
    attributes:
      label: Bối cảnh nghiệp vụ
      description: Nêu ngắn gọn tình huống người dùng đang thực hiện để đọc vào dễ hình dung ngay.
      placeholder: 'Người dùng đang ở màn hình đăng nhập, nhập sai mật khẩu của tài khoản hợp lệ rồi bấm Đăng nhập.'
    validations: { required: true }

  - type: input
    id: traceability
    attributes:
      label: Traceability
      description: Mã REQ / AC / TC liên quan. Nếu chưa có, ghi "chưa có" và nêu gap.
      placeholder: 'REQ-001 / AC-002 / TC-002'
    validations: { required: true }

  - type: dropdown
    id: severity
    attributes:
      label: Mức độ nghiêm trọng (Severity)
      options:
        - P0 / S1 - Chặn sử dụng, mất dữ liệu hoặc lỗ hổng bảo mật (Blocker)
        - P1 / S2 - Chức năng chính sai, chưa có workaround (Critical)
        - P2 / S3 - Luồng phụ, giao diện sai lệch hoặc có workaround (Major)
        - P3 / S4 - Thẩm mỹ, lệch nhỏ, tác động thấp (Minor)
    validations: { required: true }

  - type: textarea
    id: preconditions
    attributes:
      label: Tiền điều kiện (Preconditions)
      description: Trạng thái tài khoản, quyền (role), cấu hình hoặc dữ liệu cần có sẵn trước khi thực hiện.
      placeholder: 'Tài khoản hợp lệ đang ở trạng thái Active, chưa đăng nhập trên trình duyệt.'
    validations: { required: true }

  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện (Steps to Reproduce)
      description: Ghi tuần tự từng thao tác và dữ liệu nhập để Dev hoặc Tester khác làm theo là tái hiện được ngay.
      value: |
        1.
        2.
        3.
    validations: { required: true }

  - type: textarea
    id: expected_actual
    attributes:
      label: Kết quả mong đợi và kết quả thực tế
      description: 'Kết quả mong đợi đối chiếu theo AC-xx / BR-xx (nếu tài liệu chưa quy định thì ghi rõ SPEC_GAP).'
      value: |
        **Mong đợi (theo AC/BR):**

        **Thực tế:**
    validations: { required: true }

  - type: textarea
    id: environment
    attributes:
      label: Môi trường
      value: |
        - URL / môi trường:
        - Browser + phiên bản:
        - Tài khoản / role:
        - Build / commit:
    validations: { required: true }

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: 'Ảnh chụp màn hình bắt buộc khoanh vùng đỏ trực tiếp vào chỗ bị sai để nhìn hình biết ngay cần focus vào đâu (kèm trace.zip, video hoặc log).'
    validations: { required: true }

  - type: input
    id: reproducibility
    attributes:
      label: Tần suất tái hiện
      placeholder: '5/5 lần'
    validations: { required: true }

  - type: textarea
    id: notes
    attributes:
      label: Ghi chú thêm
      description: Phạm vi ảnh hưởng, dữ liệu liên quan, nghi ngờ nguyên nhân.
